
spring.application.name=gateway-tienda-sonido
server.port=8080

# ---------------------------------------------------------------------------
# Rutas hacia el microservicio de Productos.
# Puerto local: 8083.
# En Docker: PRODUCTO_SERVICE_URL.
# ---------------------------------------------------------------------------

spring.cloud.gateway.server.webflux.routes[0].id=productos
spring.cloud.gateway.server.webflux.routes[0].uri=${PRODUCTO_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/productos/**

spring.cloud.gateway.server.webflux.routes[1].id=categorias
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCTO_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/categorias/**

spring.cloud.gateway.server.webflux.routes[2].id=inventario
spring.cloud.gateway.server.webflux.routes[2].uri=${PRODUCTO_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventario/**

# ---------------------------------------------------------------------------
# Ruta hacia el microservicio de Usuarios.
# Puerto local: 8081.
# En Docker: USUARIO_SERVICE_URL.
# ---------------------------------------------------------------------------

spring.cloud.gateway.server.webflux.routes[3].id=usuarios
spring.cloud.gateway.server.webflux.routes[3].uri=${USUARIO_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/tienda-sonido/**

# ---------------------------------------------------------------------------
# Ruta hacia el microservicio de Pedidos.
# Puerto local: 8082.
# En Docker: PEDIDO_SERVICE_URL.
# ---------------------------------------------------------------------------

spring.cloud.gateway.server.webflux.routes[4].id=pedidos
spring.cloud.gateway.server.webflux.routes[4].uri=${PEDIDO_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/pedidos/**

# ---------------------------------------------------------------------------
# Filtro para evitar cabeceras CORS duplicadas.
# ---------------------------------------------------------------------------

spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# ---------------------------------------------------------------------------
# CORS del Gateway.
# ---------------------------------------------------------------------------

gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}

# ---------------------------------------------------------------------------
# Actuator: solo se expone health.
# ---------------------------------------------------------------------------

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# Logging.
# ---------------------------------------------------------------------------

logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty=WARN
