server.port=8082

spring.application.name=pedido-service

# Base de datos aislada en memoria para pruebas: no depende de un MySQL local.
spring.datasource.url=jdbc:h2:mem:sonidovivo_pedidos;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secreto fijo solo para pruebas, independiente de JWT_SECRET y de .env.docker.
jwt.secret=test-only-secret-for-sonidovivo-pedido-service-0123456789

cors.allowed-origins=http://localhost:5173

producto-service.url=http://localhost:8083

spring.main.banner-mode=off

logging.level.root=WARN
logging.level.pedido_service=INFO
