spring.application.name=producto-service
server.port=${SERVER_PORT:8083}
server.forward-headers-strategy=framework

# Base de datos MySQL (Laragon u otra instancia local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo_productos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# JWT compartido con usuario-service (emisor). Debe definirse como variable de
# entorno JWT_SECRET; Spring Boot no lee el archivo .env automaticamente.
# No se incluye ningun secreto real en el repositorio.
jwt.secret=${JWT_SECRET}

# CORS controlado para el frontend local de React + Vite
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}

# Carga idempotente del catalogo oficial (src/main/resources/catalogo/productos.json)
catalogo.carga-inicial.enabled=${CATALOGO_CARGA_INICIAL:true}
catalogo.carga-inicial.archivo=${CATALOGO_ARCHIVO:classpath:catalogo/productos.json}

# Umbral de stock critico para productos nuevos. No representa stock real.
inventario.stock-critico-inicial=${STOCK_CRITICO_INICIAL:3}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

logging.level.producto_service=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO
