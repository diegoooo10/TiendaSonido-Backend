spring.datasource.url=jdbc:h2:mem:sonidovivo_default;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=test-only-secret-for-sonidovivo-producto-service-0123456789
cors.allowed-origins=http://localhost:5173
catalogo.carga-inicial.enabled=false
inventario.stock-critico-inicial=3

spring.main.banner-mode=off
logging.level.root=WARN
logging.level.producto_service=INFO
