# Uso:
#   1. Copy-Item .env.docker.example .env.docker
#   2. Editar .env.docker con claves reales (no versionar)
#   3. docker compose --env-file .env.docker up --build -d
#
# El archivo .env local no se usa para Docker: la configuracion esta separada.
name: sonidovivo-productos

services:
  mysql:
    image: mysql:8.4
    container_name: sonidovivo-productos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sonidovivo_productos}
      MYSQL_USER: ${DB_USERNAME:?Defina DB_USERNAME en el archivo .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  producto-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonidovivo-productos-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-sonidovivo_productos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:?Defina DB_USERNAME en el archivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:4173}
      CATALOGO_CARGA_INICIAL: ${CATALOGO_CARGA_INICIAL:-true}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SERVER_PORT: 8083
    ports:
      - "${APP_PORT:-8083}:8083"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
