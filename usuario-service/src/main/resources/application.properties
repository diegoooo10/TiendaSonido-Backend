spring.application.name=usuario-service
server.port=8081

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_usuarios}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Administrador inicial: se crea una sola vez, al arrancar, y solo si no existe
# un usuario con ese correo. Nunca sobrescribe una contrasena existente.
# Los valores por defecto son exclusivamente para el entorno academico local;
# en produccion definir ADMIN_INICIAL_PASSWORD y ADMIN_INICIAL_ENABLED=false.
admin.inicial.habilitado=${ADMIN_INICIAL_ENABLED:true}
admin.inicial.correo=${ADMIN_INICIAL_CORREO:admin@duocuc.cl}
admin.inicial.password=${ADMIN_INICIAL_PASSWORD:admin}
admin.inicial.nombre=${ADMIN_INICIAL_NOMBRE:Administrador}
admin.inicial.apellido=${ADMIN_INICIAL_APELLIDO:Sonido Vivo}
admin.inicial.run=${ADMIN_INICIAL_RUN:11111111-1}
admin.inicial.fecha-nacimiento=${ADMIN_INICIAL_FECHA_NACIMIENTO:1990-01-01}
admin.inicial.direccion=${ADMIN_INICIAL_DIRECCION:Sin direccion registrada}